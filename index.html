<!doctype html>
<html lang="ko">
<head>

  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="사주를 외우는 것이 아니라 읽을 수 있게 만드는 단계별 명리 학습 서비스">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.7/lunar.min.js"></script>
